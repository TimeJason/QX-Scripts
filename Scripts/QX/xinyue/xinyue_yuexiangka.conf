#
# 心悦俱乐部悦享卡自动领取 - Quantumult X 订阅配置
#
# 作者: TimeJason
# 更新日期: 2026-10-09 (v9.1 多钩子免点击版)
#
# 使用方法:
# 1. QX -> 风车 -> 重写 -> 引用 -> 右上角 "+" -> 粘贴本文件 Raw 链接
# 2. 回到主界面, 确保"重写"和"MITM"开关已打开, 且已信任 QX 根证书
# 3. 打开一次"悦享卡"页面即可自动完成配置 (无需再手动点击"领取")
#
# 免点击说明:
#   打开「我的卡」里已开通那张卡的详情页即可完成配置 (无需点"领取")。
#   脚本挂的 3 个接口, 命中任意一个都会抓取, 并按 record_id 判断你持有哪张卡:
#     - GetCardInfo     : 已开通卡详情页。请求带 record_id -> 判定归属的唯一可靠依据(主来源)
#     - ReceiveGift     : 点击"领取"时。最精确, 含 user_info
#     - GetCardBuyStatus: 卡片的"购买页"。98/198 都会发且 record_id 恒为空,
#                         只能补 role / 卡片字段, 抓到时脚本会提示去打开"我的卡"详情页
#

[rewrite_local]
# 钩子 1: 已开通卡详情页抓取 (主来源, 带 record_id)。
^https:\/\/bgw\.xinyue\.qq\.com\/XyCard\.CardSrv\/GetCardInfo url script-request-body https://raw.githubusercontent.com/TimeJason/QX-Scripts/main/Scripts/QX/xinyue/xinyue_yuexiangka.js
# 钩子 2: 点击"领取"时抓取最精确的 body (含 user_info)。
^https:\/\/bgw\.xinyue\.qq\.com\/XyCard\.CardSrv\/ReceiveGift url script-request-body https://raw.githubusercontent.com/TimeJason/QX-Scripts/main/Scripts/QX/xinyue/xinyue_yuexiangka.js
# 钩子 3: 卡片购买页抓取 (辅助, 用于补全字段并在未识别到已开通卡时给出提示)。
^https:\/\/bgw\.xinyue\.qq\.com\/XyCard\.CardSrv\/GetCardBuyStatus url script-request-body https://raw.githubusercontent.com/TimeJason/QX-Scripts/main/Scripts/QX/xinyue/xinyue_yuexiangka.js

[mitm]
hostname = bgw.xinyue.qq.com
