#
# 心悦俱乐部悦享卡自动领取 - Quantumult X 订阅配置
#
# 作者: TimeJason
# 更新日期: 2026-10-10 (v9.6 实时状态 + 续费自愈)
#
# 使用方法:
# 1. QX -> 风车 -> 重写 -> 引用 -> 右上角 "+" -> 粘贴本文件 Raw 链接
# 2. 回到主界面, 确保"重写"和"MITM"开关已打开, 且已信任 QX 根证书
# 3. 打开一次"悦享卡"页面即可自动完成配置 (无需再手动点击"领取")
#
# 免点击说明:
#   打开「我的卡」页面即可完成配置, 无需点"领取"。脚本挂了 3 个接口, 命中任意一个都会抓取,
#   并按 record_id 判断你持有哪张卡 (record_id 非空 = 真正开通的那张):
#     - MyCardList : 打开「我的卡」时发。响应直接列出持有的卡 -> 免点击首选(读响应体)
#     - GetCardInfo: 已开通卡详情页, 请求带 record_id
#     - ReceiveGift: 点击"领取"时, 最精确, 含 user_info
#   不钩 GetCardBuyStatus(卡片的"购买页"): 它 98/198 都发且 record_id 恒为空,
#   抓到的参数缺字段领不了奖, 只会产生噪音。
#

[rewrite_local]
# 钩子 1: 「我的卡」列表 (免点击首选, 读响应体, 自动识别你持有的卡)。
^https:\/\/bgw\.xinyue\.qq\.com\/XyCard\.CardSrv\/MyCardList url script-response-body https://raw.githubusercontent.com/TimeJason/QX-Scripts/main/Scripts/QX/xinyue/xinyue_yuexiangka.js
# 钩子 2: 已开通卡详情页抓取 (请求带 record_id)。
^https:\/\/bgw\.xinyue\.qq\.com\/XyCard\.CardSrv\/GetCardInfo url script-request-body https://raw.githubusercontent.com/TimeJason/QX-Scripts/main/Scripts/QX/xinyue/xinyue_yuexiangka.js
# 钩子 3: 点击"领取"时抓取最精确的 body (含 user_info)。
^https:\/\/bgw\.xinyue\.qq\.com\/XyCard\.CardSrv\/ReceiveGift url script-request-body https://raw.githubusercontent.com/TimeJason/QX-Scripts/main/Scripts/QX/xinyue/xinyue_yuexiangka.js

[mitm]
hostname = bgw.xinyue.qq.com
